<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aditi Awasthi | Finance · Data Analytics · Business Operations</title>
    <meta name="description" content="Portfolio of Aditi Awasthi — BBA Finance student with focus on financial analysis, Python data analytics, retail business operations, and organizational strategy." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Aditi Awasthi | Finance · Data Analytics · Business Operations" />
    <meta property="og:description" content="Explore verified experience, financial modeling, Python analytics, case studies, achievements, and resume." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aditi Awasthi | Finance · Data Analytics · Business Operations" />
    <meta name="twitter:description" content="Portfolio of Aditi Awasthi — Finance, Data Analytics, and Operations." />

    <!-- Google Fonts Preconnect & Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Outfit:wght@300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Theme Initialization Script to avoid FOUC -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('portfolio-theme');
          if (storedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            // Default dark mode
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0B1120] text-[#F8FAFC] selection:bg-[#38BDF8] selection:text-[#0B1120] antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
